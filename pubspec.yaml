name: biblia_reformada
description: Leitura bíblica e estudos presbiterianos offline.
publish_to: none
version: 0.5.3+53
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.1
  archive: ^4.0.9
  crypto: ^3.0.7
  cryptography: ^2.9.0
  uuid: ^4.5.2
  ffi: ^2.2.0
  file_picker: ^10.3.10
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.7+1
  scrollable_positioned_list: ^0.3.8
  webview_flutter: ^4.14.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/licenses/
    - assets/3d/
    - assets/3d/previews/
    - assets/private/
    - assets/bundled/
    - assets/calvino-por-livro/
  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/content/EBGaramond.ttf
    - family: UiSans
      fonts:
        - asset: assets/content/Roboto-Regular.ttf
        - asset: assets/content/Roboto-Medium.ttf
          weight: 500
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif.ttf
    - family: LibreBaskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville.ttf
    - family: CrimsonPro
      fonts:
        - asset: assets/fonts/CrimsonPro.ttf
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather.ttf
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral.ttf
    - family: Bitter
      fonts:
        - asset: assets/fonts/Bitter.ttf
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible.ttf
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
