<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none';"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#272d33}canvas{display:block;touch-action:none}#error{color:#fff;font:16px sans-serif;padding:20px}#hint{position:absolute;bottom:10px;left:12px;color:#f4ead9;background:#202b32b0;border-radius:12px;padding:5px 10px;font:12px sans-serif;pointer-events:none}</style><body><div id="error"></div><div id="hint">Arraste para girar · dois dedos para ampliar</div><script src="three.min.js"></script><script src="OrbitControls.js"></script><script src="GLTFLoader.js"></script><script>
let renderer,scene,camera,controls,model,initial,ground,keyLight,frame=false,spin=false,reduced=false;const layers={};
function studioEnvironment(){const faces=[];for(let i=0;i<6;i++){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,128);g.addColorStop(0,i===2?'#ddd7c3':'#555e68');g.addColorStop(.48,'#a19b8c');g.addColorStop(1,'#33363b');x.fillStyle=g;x.fillRect(0,0,128,128);x.fillStyle='rgba(255,242,219,.72)';x.fillRect(18,12,35,50);faces.push(c)}const t=new THREE.CubeTexture(faces);t.encoding=THREE.sRGBEncoding;t.needsUpdate=true;return t}
function setup(base64){try{scene=new THREE.Scene();scene.background=new THREE.Color(0x272d33);scene.environment=studioEnvironment();camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,2000);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=false;controls.maxPolarAngle=Math.PI*.91;controls.addEventListener('change',requestRender);scene.add(new THREE.HemisphereLight(0xe9eef7,0x51432f,.85));keyLight=new THREE.DirectionalLight(0xffefda,2.4);keyLight.castShadow=true;keyLight.shadow.mapSize.set(1024,1024);keyLight.shadow.bias=-.0003;keyLight.shadow.normalBias=.025;scene.add(keyLight);scene.add(keyLight.target);const fill=new THREE.DirectionalLight(0xb9d3ec,.8);fill.position.set(-10,6,-8);scene.add(fill);const bytes=Uint8Array.from(atob(base64),c=>c.charCodeAt(0));new THREE.GLTFLoader().parse(bytes.buffer,'',g=>{model=g.scene;scene.add(model);model.traverse(n=>{if(n.userData.layer)(layers[n.userData.layer]??=[]).push(n);if(n.isMesh){n.castShadow=true;n.receiveShadow=true;if(n.material)n.material.envMapIntensity=.65}});const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),extent=box.getSize(new THREE.Vector3()),size=extent.length();initial={center,size,box,extent};ground=new THREE.Mesh(new THREE.PlaneGeometry(size*6,size*6),new THREE.MeshStandardMaterial({color:0x675943,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.position.set(center.x,box.min.y-.012*size,center.z);ground.receiveShadow=true;scene.add(ground);keyLight.position.copy(center).add(new THREE.Vector3(size*.55,size*1.3,size*.7));keyLight.target.position.copy(center);const s=keyLight.shadow.camera;s.left=s.bottom=-size;s.right=s.top=size;s.near=.01;s.far=size*5;s.updateProjectionMatrix();controls.minDistance=size*.08;controls.maxDistance=size*6;reset();requestRender();if(window.Status)Status.postMessage('ready')},e=>fail(String(e)));window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);requestRender()});let down;renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(!model||!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)return;const p=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),ray=new THREE.Raycaster();ray.setFromCamera(p,camera);const hit=ray.intersectObject(model,true).find(h=>{let o=h.object;while(o){if(!o.visible)return false;o=o.parent}return true});if(hit&&window.Status)Status.postMessage(hit.object.name)});renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();fail('Contexto gráfico perdido')});document.addEventListener('visibilitychange',()=>{if(document.hidden)spin=false;requestRender()})}catch(e){fail(String(e))}}
function requestRender(){if(frame)return;frame=true;requestAnimationFrame(()=>{frame=false;if(renderer&&scene){if(spin&&!reduced&&!document.hidden&&model){model.rotation.y+=.0025;requestRender()}renderer.render(scene,camera)}})}function render(){requestRender()}function fail(e){document.getElementById('error').textContent='Visualização indisponível. A descrição textual continua acessível.';if(window.Status)Status.postMessage('error: '+e)}
function reset(){if(!initial)return;const c=initial.center,s=initial.size;controls.target.copy(c);camera.position.copy(c).add(new THREE.Vector3(s*.68,s*.43,s*.68));camera.near=Math.max(.001,s/2000);camera.far=s*30;camera.updateProjectionMatrix();if(model)model.rotation.set(0,0,0);controls.update();requestRender()}function rotate(d){if(model){model.rotation.y+=d*Math.PI/180;requestRender()}}function zoom(f){const delta=camera.position.clone().sub(controls.target),length=delta.length()*f;if(length<controls.minDistance||length>controls.maxDistance)return;camera.position.copy(controls.target).add(delta.multiplyScalar(f));controls.update();requestRender()}function layer(name,visible){(layers[name]||[]).forEach(n=>n.visible=visible);requestRender()}
function turntable(v){spin=!!v&&!reduced;requestRender()}function reduceMotion(v){reduced=!!v;if(reduced)spin=false}function viewpoint(n){if(!initial)return;const c=initial.center,s=initial.size,v=n==='top'?new THREE.Vector3(.001,s*.95,.001):n==='front'?new THREE.Vector3(0,s*.14,s):new THREE.Vector3(s*.68,s*.43,s*.68);camera.position.copy(c).add(v);controls.target.copy(c);controls.update();requestRender()}function atmosphere(n){if(!scene)return;const warm=n==='warm';scene.background.set(warm?0x272d33:0x18212e);if(ground)ground.material.color.set(warm?0x675943:0x424c5b);if(keyLight)keyLight.color.set(warm?0xffefda:0xf3f7ff);renderer.toneMappingExposure=warm?1.05:1.15;requestRender()}
</script></body></html>
