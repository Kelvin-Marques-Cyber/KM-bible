group 'br.com.kelvin.needle_runtime'
version '1.0'
apply plugin: 'com.android.library'
android {
    namespace 'br.com.kelvin.needle_runtime'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        minSdk 24
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static'; abiFilters 'arm64-v8a' } }
    }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
}
