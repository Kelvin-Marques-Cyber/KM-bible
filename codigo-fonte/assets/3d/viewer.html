<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none';"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1c2430}canvas{display:block}#error{color:#fff;font:16px sans-serif;padding:20px}</style><body><div id="error"></div><script src="three.min.js"></script><script src="OrbitControls.js"></script><script src="GLTFLoader.js"></script><script>
let renderer,scene,camera,controls,model,initial;const layers={};
function setup(base64){try{scene=new THREE.Scene();scene.background=new THREE.Color(0x1c2430);camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,2000);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=false;scene.add(new THREE.HemisphereLight(0xffffff,0x5b4f42,1.8));let light=new THREE.DirectionalLight(0xffffff,1.5);light.position.set(30,60,40);scene.add(light);let bytes=Uint8Array.from(atob(base64),c=>c.charCodeAt(0));new THREE.GLTFLoader().parse(bytes.buffer,'',g=>{model=g.scene;scene.add(model);model.traverse(n=>{if(n.userData.layer)(layers[n.userData.layer]??=[]).push(n)});let box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()).length();initial={center,size};reset();render();if(window.Status)Status.postMessage('ready')},e=>fail(String(e)));controls.addEventListener('change',render);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render()});renderer.domElement.addEventListener('click',e=>{let pointer=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),ray=new THREE.Raycaster();ray.setFromCamera(pointer,camera);let hit=ray.intersectObject(model,true).find(h=>h.object.visible);if(hit&&window.Status)Status.postMessage(hit.object.name)});}catch(e){fail(String(e))}}
function render(){if(renderer&&scene)renderer.render(scene,camera)}function fail(e){document.getElementById('error').textContent='Visualização indisponível. Use a descrição textual.';if(window.Status)Status.postMessage('error: '+e)}
function reset(){if(!initial)return;let c=initial.center,s=initial.size;controls.target.copy(c);camera.position.copy(c).add(new THREE.Vector3(s*.65,s*.48,s*.65));camera.near=Math.max(.001,s/10000);camera.far=s*100;camera.updateProjectionMatrix();controls.update();render()}
function rotate(degrees){if(!model)return;model.rotation.y+=degrees*Math.PI/180;render()}function zoom(factor){let delta=camera.position.clone().sub(controls.target);camera.position.copy(controls.target).add(delta.multiplyScalar(factor));controls.update();render()}function layer(name,visible){(layers[name]||[]).forEach(n=>n.visible=visible);render()}
</script></body></html>
