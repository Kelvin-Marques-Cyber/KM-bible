name: Android — APK 0.4.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Flutter do projeto
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Instalar Android SDK / NDK
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          yes | sdkmanager --licenses >/dev/null || true
      - name: Configurar assinatura pessoal, se disponível
        shell: bash
        env:
          BIBLIA_KEYSTORE_BASE64: ${{ secrets.BIBLIA_KEYSTORE_BASE64 }}
          BIBLIA_KEY_ALIAS: ${{ secrets.BIBLIA_KEY_ALIAS }}
          BIBLIA_STORE_PASSWORD: ${{ secrets.BIBLIA_STORE_PASSWORD }}
          BIBLIA_KEY_PASSWORD: ${{ secrets.BIBLIA_KEY_PASSWORD }}
        run: |
          if [[ -n "$BIBLIA_KEYSTORE_BASE64" ]]; then
            : "${BIBLIA_KEY_ALIAS:?Secret BIBLIA_KEY_ALIAS ausente}"
            : "${BIBLIA_STORE_PASSWORD:?Secret BIBLIA_STORE_PASSWORD ausente}"
            : "${BIBLIA_KEY_PASSWORD:?Secret BIBLIA_KEY_PASSWORD ausente}"
            printf '%s' "$BIBLIA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/biblia-release.jks"
            chmod 600 "$RUNNER_TEMP/biblia-release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
              "$RUNNER_TEMP/biblia-release.jks" "$BIBLIA_STORE_PASSWORD" "$BIBLIA_KEY_PASSWORD" "$BIBLIA_KEY_ALIAS" > android/key.properties
            chmod 600 android/key.properties
            echo 'Usando assinatura pessoal dos segredos do repositório.'
          else
            echo 'Nenhum keystore privado: APK de release será assinado com a chave DEBUG deste executor.'
            echo 'ATENÇÃO: Esta chave muda entre execuções e não atualiza APKs assinados com outra chave.'
          fi
      - name: Resolver dependências
        run: flutter --suppress-analytics pub get
      - name: Compilar APK ARM64
        run: flutter --suppress-analytics build apk --release --target-platform android-arm64 --no-pub
      - name: Gerar checksum
        shell: bash
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > SHA256SUMS.txt
      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-Reformada-0.4.0-Android-arm64
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
