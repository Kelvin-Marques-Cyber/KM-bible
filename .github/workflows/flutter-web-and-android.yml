name: Flutter Web otimizado e APK de teste
on:
  push:
    branches: [flutter-web-fiel]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'scripts/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-web-and-android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: biblia-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Compilar Flutter Web com bancos compactados
        run: bash scripts/build_flutter_web_fiel.sh
      - name: Conferir se ARA privada nao foi incluida
        shell: bash
        run: |
          test -s build/web/index.html
          test -s build/web/assets/assets/content/catalogue.sqlite
          if [[ -d build/web/assets/assets/private ]]; then
            ! find build/web/assets/assets/private -type f \( -name '*.biblepkg' -o -name '*.sqlite' \) | grep -q .
          fi
      - name: Gerar manifesto PWA e cache offline
        shell: bash
        run: |
          cp scripts/sw_flutter_teste.js build/web/sw.js
          sed -i "s/biblia-flutter-web-053-20261013/biblia-flutter-web-${{ github.sha }}/" build/web/sw.js
          touch build/web/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          f=Path('build/web/index.html')
          s=f.read_text()
          snippet="""<script>
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', () =>
              navigator.serviceWorker.register('./sw.js', {scope:'./'}).catch(console.warn));
          }
          </script>"""
          if "register('./sw.js'" not in s:
            s=s.replace('</body>',snippet+'\n</body>')
            f.write_text(s)
          PY
      - name: Publicar nova versao compilada em gh-pages sem remover diagnosticos
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false
          commit_message: 'Teste Android/PWA: Flutter otimizado ${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: biblia-reformada-web-otimizada
          path: build/biblia-reformada-flutter-web.zip
          retention-days: 7
          compression-level: 0
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Instalar SDK Android
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          yes | sdkmanager --licenses >/dev/null || true
      - name: Configurar assinatura se segredos existentes
        shell: bash
        env:
          KEYSTORE: ${{ secrets.BIBLIA_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.BIBLIA_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.BIBLIA_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BIBLIA_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$RUNNER_TEMP/release.jks" "$STORE_PASS" "$KEY_PASS" "$ALIAS" > android/key.properties
          fi
      - name: Compilar APK ARM64
        run: bash scripts/build_android_otimizado.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Biblia-Reformada-Android-ARM64-v0.5.4
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          compression-level: 0
