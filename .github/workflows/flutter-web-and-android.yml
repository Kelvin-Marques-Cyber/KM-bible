name: Flutter Web otimizado e APK de teste
on:
  workflow_dispatch:
    inputs:
      publicar_classico:
        description: 'Publicar a versao Flutter em gh-pages como classico.html (a raiz e a PWA)'
        type: boolean
        default: false
      criar_release:
        description: 'Publicar o APK em Releases (tag apk-v<versao>)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: biblia-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preparar-portugues:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reutilizar traducoes ja geradas
        uses: actions/cache@v4
        with:
          path: |
            assets/content/portuguese.sqlite
            assets/content/portuguese.sha256
            assets/content/portuguese-coverage.json
          key: calvino-ptbr-v1-${{ hashFiles('assets/bundled/CalvinCommentaries.biblepkg', 'assets/content/portuguese.sqlite') }}
      - name: Preparar todas as traducoes de Joao Calvino
        run: bash scripts/preparar_calvino_ptbr.sh
      - name: Validar cobertura integral
        run: python3 scripts/verificar_traducoes_calvino.py
      - name: Compactar banco de traducao para Web e APK
        run: tar -cf calvino-ptbr.tar assets/content/portuguese.sqlite assets/content/portuguese.sha256 assets/content/portuguese-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: calvino-ptbr-db
          path: calvino-ptbr.tar
          retention-days: 7
          compression-level: 0
  web:
    needs: preparar-portugues
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: calvino-ptbr-db
      - name: Carregar banco pt-BR antes do build
        run: tar -xf calvino-ptbr.tar
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Compilar Flutter Web com bancos compactados
        run: bash scripts/build_flutter_web_fiel.sh
      - name: Conferir se ARA privada nao foi incluida
        shell: bash
        run: |
          test -s build/web/index.html
          test -s build/web/assets/assets/content/catalogue.sqlite
          if [[ -d build/web/assets/assets/private ]]; then
            ! find build/web/assets/assets/private -type f \( -name '*.biblepkg' -o -name '*.sqlite' \) | grep -q .
          fi
      - name: Preparar versao classica (sem substituir a PWA da raiz)
        if: ${{ inputs.publicar_classico }}
        shell: bash
        run: |
          # A raiz de gh-pages e a PWA (pwa/scripts/publish_gh_pages.sh). A versao Flutter
          # fica em classico.html; index.html, sw.js e flutter_service_worker.js da PWA
          # nunca sao sobrescritos (eles fazem a atualizacao obrigatoria dos usuarios).
          mv build/web/index.html build/web/classico.html
          rm -f build/web/sw.js build/web/flutter_service_worker.js build/web/manifest.webmanifest
          touch build/web/.nojekyll
      - name: Publicar versao classica em gh-pages sem remover a PWA
        if: ${{ inputs.publicar_classico }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false
          commit_message: 'Versao classica (Flutter) ${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: biblia-reformada-web-otimizada
          path: build/biblia-reformada-flutter-web.zip
          retention-days: 7
          compression-level: 0
  apk:
    needs: preparar-portugues
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: calvino-ptbr-db
      - name: Carregar banco pt-BR antes do build
        run: tar -xf calvino-ptbr.tar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Instalar SDK Android
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          yes | sdkmanager --licenses >/dev/null || true
      - name: Configurar assinatura se segredos existentes
        shell: bash
        env:
          KEYSTORE: ${{ secrets.BIBLIA_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.BIBLIA_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.BIBLIA_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BIBLIA_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$RUNNER_TEMP/release.jks" "$STORE_PASS" "$KEY_PASS" "$ALIAS" > android/key.properties
          fi
      - name: Compilar APK ARM64
        env:
          APK_VERSION_NAME: '0.5.5'
          APK_VERSION_CODE: '55'
        run: bash scripts/build_android_otimizado.sh
      - name: Publicar APK em Releases
        if: ${{ inputs.criar_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEYSTORE: ${{ secrets.BIBLIA_KEYSTORE_BASE64 }}
        run: |
          versao=0.5.5
          tag="apk-v$versao"
          apk="BibliaReformada-$versao-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          soma="$(sha256sum "$apk" | cut -d' ' -f1)"
          if [[ -n "$KEYSTORE" ]]; then
            assinatura='Assinado com a chave do projeto: atualiza a versao instalada.'
          else
            assinatura='ATENCAO: assinado com chave de depuracao (sem segredos BIBLIA_KEYSTORE_*): nao atualiza APK com outra assinatura; faca backup, desinstale e restaure.'
          fi
          printf '%s\n\n%s\n\nSHA-256: `%s`\n' \
            "Biblia Reformada $versao para Android ARM64 (comentarios de Joao Calvino em pt-BR, ARA e modulos pre-instalados)." \
            "$assinatura" "$soma" > notas.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --notes-file notas.md
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" \
              --title "Biblia Reformada $versao - Android" --notes-file notas.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Biblia-Reformada-Android-ARM64-v0.5.5
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          compression-level: 0
