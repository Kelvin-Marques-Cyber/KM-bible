<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bíblia Lumen</title>
    <meta name="description" content="Bíblia Lumen: leitura bíblica, comentários, confissões, estudos e anotações — offline, rápida e instalável." />
    <meta name="theme-color" content="#f4efdf" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bíblia Lumen" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      /* Primeira pintura instantânea, antes do JavaScript: cores do tema salvo. */
      html,body{margin:0;background:var(--boot-bg,#f4efdf);color:var(--boot-fg,#211c16);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
      #boot svg{width:56px;height:56px;opacity:.85}
      #boot p{margin:0;font-size:15px;opacity:.75}
      #boot .bar{width:120px;height:3px;border-radius:3px;background:currentColor;opacity:.15;overflow:hidden}
      #boot .bar i{display:block;width:40%;height:100%;background:currentColor;opacity:.9;animation:km 1.1s ease-in-out infinite}
      @keyframes km{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
      @media (prefers-reduced-motion:reduce){#boot .bar i{animation:none}}
    </style>
    <script>
      (function () {
        // Aplica o tema salvo sem esperar o aplicativo (evita "flash" branco).
        var themes = {light:['#faf9f6','#211c16'],sepia:['#f4efdf','#211c16'],dark:['#181f29','#ebe9e2'],midnight:['#101827','#ebe9e2'],forest:['#14211a','#ebe9e2'],oled:['#000000','#ebe9e2'],coffee:['#241c17','#ebe9e2'],ocean:['#102327','#ebe9e2'],wine:['#281820','#ebe9e2'],parchment:['#eee0c9','#211c16'],ivory:['#fff8eb','#211c16'],lavender:['#f4f0fa','#211c16'],mist:['#edf0f2','#211c16'],rose:['#fbefee','#211c16']};
        try {
          var id = JSON.parse(localStorage.getItem('km-pref:theme') || '"sepia"');
          var t = themes[id] || themes.sepia;
          document.documentElement.style.setProperty('--boot-bg', t[0]);
          document.documentElement.style.setProperty('--boot-fg', t[1]);
          document.querySelector('meta[name=theme-color]').setAttribute('content', t[0]);
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="./app/index-DaX2iyWv.js"></script>
    <link rel="modulepreload" crossorigin href="./app/react-C8w-UNLI.js">
    <link rel="stylesheet" crossorigin href="./app/index-DUxSEmta.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-live="polite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
      <p>Bíblia Lumen</p>
      <div class="bar"><i></i></div>
      <noscript><p>Ative o JavaScript para usar a Bíblia Lumen.</p></noscript>
    </div>
  </body>
</html>
