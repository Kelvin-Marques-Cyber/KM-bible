workflows:
  ios-unsigned:
    name: Biblia Reformada iOS - IPA sem assinatura
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Conferir Flutter e instalar dependencias
        script: |
          flutter --version
          flutter pub get

      - name: Compilar iOS sem assinatura
        script: |
          flutter build ios --release --no-codesign

      - name: Empacotar IPA de teste
        script: |
          set -e
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry BibliaReformada-0.5.3-unsigned.ipa Payload

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  flutter-web-fidelidade:
    name: Biblia Reformada - Flutter Web fiel ao APK (diagnostico)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: stable
    scripts:
      - name: Compilar exatamente os widgets Flutter do aplicativo Android
        script: |
          bash scripts/build_flutter_web_fiel.sh
    artifacts:
      - build/biblia-reformada-flutter-web.zip
      - flutter-web-build.log
      - flutter-web-dependencias.txt
